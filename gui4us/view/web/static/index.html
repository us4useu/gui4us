<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GUI4us</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; display: grid; grid-template-columns: 20rem 1fr;
             grid-template-rows: minmax(0, 1fr);
             background: #0d0d11; color: #e6e6e6; font-family: system-ui, sans-serif; }
      aside { display: flex; flex-direction: column; gap: 1px; background: #0d0d11;
              overflow-x: hidden; overflow-y: auto; border-right: 1px solid #26262e; min-width: 0; }
      aside > * { min-width: 0; }
      /* Thin, dark scrollbars: the standard properties (current browsers) and the -webkit- ones (the Qt
         WebEngine of the gui4us application window, Chromium 83). */
      @supports not selector(::-webkit-scrollbar) {
        * { scrollbar-width: thin; scrollbar-color: #3a3d47 transparent; }
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-button { display: none; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #3a3d47; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #555a66; }
      ::-webkit-scrollbar-corner { background: transparent; }
      main { padding: 10px; overflow: auto; min-height: 0; box-sizing: border-box; }
      /* Displays share the window: rows split the height, so an image never overflows it.
         The gap keeps them apart -- they used to touch along their edges. */
      #displays { display: grid; gap: 14px; height: 100%;
                  grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
                  grid-auto-rows: minmax(12rem, 1fr); }
      #displays > * { border: 1px solid #23262d; border-radius: 6px; overflow: hidden; }
      .logo { display: flex; align-items: center; gap: .6rem; padding: .85rem .9rem .8rem;
              background: #13131a; border-bottom: 1px solid #26262e; }
      .logo svg { display: block; }
      .logo .subtitle { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
                        color: #6d737e; }
      g4u-control-panel { flex: 1; }
    </style>
    <script type="module" crossorigin src="/assets/index-B0FUT-cg.js"></script>
  </head>
  <body>
    <aside>
      <div class="logo">
        <svg width="132" height="30" viewBox="0 0 132 30" role="img" aria-label="gui4us">
          <defs>
            <linearGradient id="g4u-logo-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4fc3f7"/>
              <stop offset="100%" stop-color="#3d8bfd"/>
            </linearGradient>
          </defs>
          <!-- An ultrasound beam: the probe aperture and three wavefronts. -->
          <g transform="translate(2 3)">
            <rect x="0" y="0" width="22" height="5" rx="2" fill="url(#g4u-logo-gradient)"/>
            <path d="M3 9 A 12 12 0 0 0 19 9" fill="none" stroke="url(#g4u-logo-gradient)"
                  stroke-width="2" stroke-linecap="round" opacity=".85"/>
            <path d="M1 14 A 17 17 0 0 0 21 14" fill="none" stroke="url(#g4u-logo-gradient)"
                  stroke-width="2" stroke-linecap="round" opacity=".55"/>
            <path d="M0 19 A 22 22 0 0 0 22 19" fill="none" stroke="url(#g4u-logo-gradient)"
                  stroke-width="2" stroke-linecap="round" opacity=".3"/>
          </g>
          <text x="32" y="21" font-family="system-ui, sans-serif" font-size="19"
                font-weight="600" fill="#eef1f6">gui<tspan fill="#4fc3f7">4</tspan>us</text>
        </svg>
        <span class="subtitle">ultrasound</span>
      </div>
      <g4u-actions-panel></g4u-actions-panel>
      <g4u-capture-panel></g4u-capture-panel>
      <g4u-control-panel></g4u-control-panel>
    </aside>
    <main><div id="displays"></div></main>
  </body>
</html>
